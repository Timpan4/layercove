name: Publish container

on:
  workflow_run:
    workflows: [CI, Container release request]
    types: [completed]

env:
  IMAGE_NAME: ghcr.io/timpan4/layercove

permissions: {}

jobs:
  verify:
    name: Verify the requested commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main') ||
        (github.event.workflow_run.path == '.github/workflows/container-release-request.yml' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      release_tag: ${{ steps.ci.outputs.release_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: github.event.workflow_run.path == '.github/workflows/container-release-request.yml'
        with:
          name: container-release-ref-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/container-release-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Require successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_REQUEST: ${{ github.event.workflow_run.path == '.github/workflows/container-release-request.yml' }}
        run: |
          source_ref=refs/heads/main
          if [[ "$RELEASE_REQUEST" == true ]]; then
            IFS= read -r source_ref < "$RUNNER_TEMP/container-release-request/container-ref.txt"
          fi
          run_id=$(bash scripts/require-container-ci.sh "$SOURCE_SHA" "$source_ref")
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$source_ref" == refs/tags/* ]]; then
            echo "release_tag=${source_ref#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
          echo "CI passed for $SOURCE_SHA in run $run_id."

  publish:
    name: Publish the verified commit image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-container-${{ needs.verify.outputs.sha }}
      queue: max
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.2

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an attested image at this commit
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          digest=$(bash publisher/scripts/find-container-digest.sh "$IMAGE_NAME" "$SOURCE_SHA")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        if: steps.existing.outputs.digest == ''
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=sha-${{ needs.verify.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}

      - name: Build and publish
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push=true,push-by-digest=true,name-canonical=true,oci-mediatypes=true
          annotations: index:org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max

      - name: Attest build provenance
        if: steps.existing.outputs.digest == ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate: |
            {
              "buildDefinition": {
                "buildType": "${{ github.server_url }}/${{ github.repository }}/blob/main/.github/workflows/publish-container.yml",
                "externalParameters": {"sourceCommit": "${{ needs.verify.outputs.sha }}"},
                "resolvedDependencies": [
                  {"uri": "git+${{ github.server_url }}/${{ github.repository }}", "digest": {"gitCommit": "${{ needs.verify.outputs.sha }}"}},
                  {"uri": "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/.github/workflows/publish-container.yml", "digest": {"gitCommit": "${{ github.sha }}"}}
                ]
              },
              "runDetails": {
                "builder": {"id": "https://github.com/actions/runner/github-hosted"},
                "metadata": {"invocationId": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"}
              }
            }
          push-to-registry: true
          create-storage-record: false

      - name: Tag the attested image with its commit
        if: steps.existing.outputs.digest == ''
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: docker buildx imagetools create --tag "$IMAGE_NAME:sha-$SOURCE_SHA" "$IMAGE_NAME@$IMAGE_DIGEST"

  promote:
    name: Tag the verified image
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-container-promotion
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.2

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote by commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$RELEASE_TAG" --jq .sha)
            if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
              echo 'The Git tag moved after verification.' >&2
              exit 1
            fi
            version=${RELEASE_TAG#v}
            tags=(--tag "$IMAGE_NAME:$version")
            if [[ "$version" != *-* ]]; then
              minor=${version%.*}
              candidates=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$minor." \
                --jq '.[].ref | ltrimstr("refs/tags/v") | select(test("^[0-9]+[.][0-9]+[.][0-9]+$"))')
              ordered=$(printf '%s\n' "$candidates" "$version" | sort -Vr)
              while IFS= read -r candidate && [[ "$candidate" != "$version" ]]; do
                newer_digest=$(bash scripts/registry-container-digest.sh "$IMAGE_NAME:$candidate")
                if [[ -n "$newer_digest" ]]; then
                  break
                fi
              done <<< "$ordered"
              if [[ "$candidate" == "$version" ]]; then
                tags+=(--tag "$IMAGE_NAME:$minor")
              fi
            fi
            docker buildx imagetools create "${tags[@]}" "$IMAGE_NAME@$IMAGE_DIGEST"
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$tip" != "$SOURCE_SHA" ]]; then
            IMAGE_DIGEST=$(bash scripts/find-container-digest.sh "$IMAGE_NAME" "$tip")
          fi
          if [[ -z "$IMAGE_DIGEST" ]]; then
            echo "::notice::Main tip $tip has no published image."
            exit 0
          fi
          current_tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$current_tip" != "$tip" ]]; then
            echo "::notice::Main advanced during promotion."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE_NAME:latest" "$IMAGE_NAME@$IMAGE_DIGEST"
