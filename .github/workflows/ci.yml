name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  BUN_VERSION: '1.3.14'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions for all jobs
permissions:
  contents: read

jobs:
  # ============================================================================
  # Backend Checks
  # ============================================================================

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check backend/

      - name: Run ruff format check
        run: ruff format --check backend/

  backend-tests:
    name: Backend Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: backend-lint
    strategy:
      # Don't cancel sibling shards if one fails — we want every shard's
      # failure list, not just the first one, so a single PR push shows
      # all broken tests in one go.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Run tests (shard ${{ matrix.shard }}/4)
        timeout-minutes: 10
        working-directory: backend
        run: |
          python -m pytest tests/ \
            --tb=short \
            --timeout=60 --timeout-method=thread \
            -n auto \
            --durations-path .test_durations \
            --splitting-algorithm least_duration \
            --splits 4 --group ${{ matrix.shard }}

  postgres-camera-token-test:
    name: PostgreSQL Camera Token Expiry
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: layercove_test
          POSTGRES_DB: layercove_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d layercove_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DATABASE_URL: postgresql+asyncpg://postgres:layercove_test@127.0.0.1:5432/layercove_test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Verify camera token expiry against PostgreSQL clock
        run: python -m pytest backend/tests/integration/test_postgres_camera_token_expiry.py --tb=short

  # ============================================================================
  # Frontend Checks
  # ============================================================================

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run Oxlint
        working-directory: frontend
        run: bun run lint

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run TypeScript check
        working-directory: frontend
        run: bun x tsc --noEmit

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        working-directory: frontend
        run: bun run build

      - name: Run tests
        timeout-minutes: 10
        working-directory: frontend
        run: bun run test:run

  # ============================================================================
  # Docker Tests (matches test_docker.sh)
  # ============================================================================

  # Run the full suite on deployment Python inside the test image. The
  # committed duration map keeps all four runners busy for similar periods.
  docker-backend-tests:
    name: Docker Backend Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # BuildKit's GHA cache avoids rebuilding dependency layers on each shard.
      - name: Build backend test image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.test
          target: backend-test
          load: true
          tags: bambuddy-backend-test:latest
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,scope=backend-test,mode=max

      - name: Run backend tests in Docker (shard ${{ matrix.shard }}/4)
        run: |
          docker run --rm \
            -e TESTING=1 \
            -e PYTHONUNBUFFERED=1 \
            -e TEST_REPOSITORY_ROOT=/workspace \
            -v "$PWD:/workspace:ro" \
            bambuddy-backend-test:latest \
            pytest backend/tests/ \
              --rootdir=backend/tests \
              --tb=short \
              --timeout=60 --timeout-method=thread \
              -p no:cacheprovider \
              -n auto \
              --durations-path backend/.test_durations \
              --splitting-algorithm least_duration \
              --splits 4 --group ${{ matrix.shard }}

  docker-test:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-lint, frontend-lint, frontend-typecheck]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: bambuddy:test
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max

      - name: Verify backend imports
        run: docker run --rm bambuddy:test python -c "import backend.app.main; print('Backend imports OK')"

      - name: Verify static files exist
        run: docker run --rm bambuddy:test test -d /app/static

      # Smoke-test the production container
      - name: Build integration container
        run: docker compose -f docker-compose.test.yml build integration

      - name: Start integration container
        run: |
          docker compose -f docker-compose.test.yml up -d integration
          echo "Waiting for container to be healthy..."
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml ps integration | grep -q "healthy"; then
              echo "Container is healthy"
              break
            fi
            sleep 2
          done

      - name: Test health endpoint
        run: |
          HEALTH=$(docker compose -f docker-compose.test.yml exec -T integration curl -s http://localhost:8000/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q "healthy"

      - name: Test API endpoint
        run: |
          docker compose -f docker-compose.test.yml exec -T integration curl -s http://localhost:8000/api/v1/settings

      - name: Test static files served
        run: |
          STATUS=$(docker compose -f docker-compose.test.yml exec -T integration curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/)
          echo "Static files HTTP status: $STATUS"
          [ "$STATUS" = "200" ]

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
