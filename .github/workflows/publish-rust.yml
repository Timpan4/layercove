name: Publish layercove-rs

# Publishes only a main commit whose CI run succeeded, built from that exact
# SHA (#90). The image is tagged with the tested SHA.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One run per commit. A shared group would let a late run for an older commit
# cancel the publish of a newer one.
concurrency:
  group: publish-rust-${{ github.event.workflow_run.head_sha }}

env:
  IMAGE_NAME: ghcr.io/timpan4/layercove-rs

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish layercove-rs image
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Choose tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tags="$IMAGE_NAME:sha-$SHA"
          # A late or rerun CI for an older commit must not move :main back.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SHA" ]; then
            tags="$tags,$IMAGE_NAME:main"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=rust
          cache-to: type=gha,scope=rust,mode=max

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
