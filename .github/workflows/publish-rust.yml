name: Publish layercove-rs

# Publishes only a main commit whose CI run succeeded, built from that exact
# SHA (#90). The image is tagged with the tested SHA, then :main is pointed at
# the image for the current tip of main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/timpan4/layercove-rs

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish layercove-rs image
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # One build per commit. A shared group would let a late run for an older
    # commit cancel the build of a newer one.
    concurrency:
      group: publish-rust-${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=rust
          cache-to: type=gha,scope=rust,mode=max

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  promote:
    name: Point main at the tip of main
    needs: publish
    runs-on: ubuntu-latest
    # Serialized, and each run reads the tip immediately before retagging, so
    # :main only moves forward. A late run for an older commit promotes the tip.
    concurrency:
      group: publish-rust-main
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag the tip's image as main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          # Only this workflow pushes sha- tags, after CI passed for that commit.
          if ! docker buildx imagetools inspect "$IMAGE_NAME:sha-$tip" > /dev/null; then
            echo "::notice::No image for tip $tip yet; its own run will promote it."
            exit 0
          fi
          # A single index source is copied unchanged, so the digest and its
          # attestations are kept.
          docker buildx imagetools create --tag "$IMAGE_NAME:main" "$IMAGE_NAME:sha-$tip"
