name: PR117 review workspace
on:
  push:
    branches: [validation/pr117-review-feedback]
    paths: [.github/workflows/pr117-review-workspace.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: validation/pr117-review-feedback
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Apply verified review patches
        shell: bash
        run: |
          set -euo pipefail
          cp .tmp/pr117-review/backend.patch /tmp/backend-review.patch
          cat .tmp/pr117-review/frontend.* > /tmp/frontend-review.patch
          echo '73f36e9bf72195b072893ffc6924219c0b8cde63a7dc32b5dbd0cbcdfcf49768  /tmp/backend-review.patch' | sha256sum --check
          echo '5a1870294d51505ead52374b72ae2223e8807277d4de8738694e2feb9dd72766  /tmp/frontend-review.patch' | sha256sum --check
          git apply --check /tmp/backend-review.patch
          git apply --check /tmp/frontend-review.patch
          git branch --show-current
          git apply /tmp/backend-review.patch
          git branch --show-current
          git apply /tmp/frontend-review.patch
          git diff --check
      - name: Validate backend review regressions
        run: |
          uv pip install --system -r requirements.txt -r requirements-dev.txt
          python -m ruff check backend/
          python -m ruff format --check backend/
          python -m pytest backend/tests/unit/test_slicer_output.py backend/tests/integration/test_library_slice_api.py -q --tb=short --timeout=60 --timeout-method=thread
      - name: Validate dispatch localization
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run build
          bun x vitest run src/__tests__/components/DispatchLocalization.test.tsx src/__tests__/components/QueueDispatchProgress.test.tsx src/__tests__/components/PrinterQueueDispatch.test.tsx src/__tests__/contexts/DispatchToastContext.test.tsx --maxWorkers=2
          bun run check:i18n
          bun run test:brand
      - name: Assemble clean source trees
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/pr117-review
          rm .github/workflows/pr117-review-workspace.yml
          git branch --show-current
          git add -A -- .tmp/pr117-review .github/workflows/pr117-review-workspace.yml backend/app/api/routes/library.py backend/app/services/slicer_output.py backend/tests/integration/test_library_slice_api.py backend/tests/unit/test_slicer_output.py
          git branch --show-current
          git -c user.name='Timpan4' -c user.email='70634109+Timpan4@users.noreply.github.com' commit -m 'fix: bound slice filenames and guard 3MF-only arrangement'
          echo "BACKEND_TREE=$(git rev-parse HEAD^{tree})"
          git branch --show-current
          git add -- frontend/src/components/QueueDispatchProgress.tsx frontend/src/components/PrinterQueueWidget.tsx frontend/src/contexts/ToastContext.tsx frontend/src/i18n/locales frontend/src/__tests__/components/DispatchLocalization.test.tsx
          git branch --show-current
          git -c user.name='Timpan4' -c user.email='70634109+Timpan4@users.noreply.github.com' commit -m 'fix: localize print dispatch progress and toasts'
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
          git branch --show-current
          git push origin HEAD:validation/pr117-review-feedback
