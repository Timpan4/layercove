name: Validate Orca output and orientation
on:
  push:
    branches: [validation/orca-output-orientation]
    paths: [.github/workflows/validate-orca-output.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 48256dfa064e5744de871d8bb479b7c1935ec111
          persist-credentials: false
      - name: Archive exact PR source
        run: |
          git branch --show-current
          git archive --format=tar.gz HEAD > /tmp/layercove-pr117.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: source-pr117
          path: /tmp/layercove-pr117.tar.gz
          retention-days: 1
