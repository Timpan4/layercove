name: Validate Orca filenames
on:
  push:
    branches: [validation/orca-output-orientation]
    paths: [.github/workflows/validate-orca-output.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor == 'Timpan4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: validation/orca-output-orientation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
      - name: Apply checksum-verified regression patch
        env:
          PATCH_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          payload = gzip.decompress(base64.b64decode(os.environ['PATCH_B64']))
          assert hashlib.sha256(payload).hexdigest() == '60e1d53ee49ab73be1375077ad224bc7360c506735bcb8eb4aa82eb3cf790452'
          Path('/tmp/naming.patch').write_bytes(payload)
          PY
          git branch --show-current
          git apply --check --unidiff-zero /tmp/naming.patch
          git branch --show-current
          git apply --unidiff-zero /tmp/naming.patch
      - name: Validate changed production paths
        run: |
          uv run --with-requirements requirements.txt --with-requirements requirements-dev.txt ruff check backend/
          uv run --with-requirements requirements-dev.txt ruff format --check backend/
          uv run --with-requirements requirements.txt --with-requirements requirements-dev.txt pytest backend/tests/unit/test_slicer_filename.py backend/tests/unit/test_moonraker_upload_filename.py backend/tests/unit/test_moonraker_http.py backend/tests/unit/test_scheduler_provider_dispatch.py backend/tests/unit/test_dispatch_pipeline_regressions.py backend/tests/integration/test_catalog_klipper_pipeline.py backend/tests/integration/test_fake_moonraker.py backend/tests/integration/test_library_slice_api.py -q --tb=short --timeout=60
      - name: Commit only the verified source changes on the validation branch
        run: |
          rm .github/workflows/validate-orca-output.yml
          git diff --check
          git branch --show-current
          git add backend .github/workflows/validate-orca-output.yml
          git branch --show-current
          git -c user.name='Timpan4' -c user.email='70634109+Timpan4@users.noreply.github.com' commit -m 'fix: preserve Orca filenames in isolated Moonraker dispatch folders'
          test "$(git branch --show-current)" = validation/orca-output-orientation
          git push origin HEAD:validation/orca-output-orientation
