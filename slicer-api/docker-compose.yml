# Optional slicer sidecars. Images must be supplied as immutable references
# (for example, image@sha256:...). No host ports are published by default.

services:
  orca-slicer-api:
    image: ${ORCA_SIDECAR_IMAGE:?set ORCA_SIDECAR_IMAGE to an immutable image@sha256 reference}
    container_name: orca-slicer-api
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./data/orca:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
      ORCA_EXPECTED_CONTRACT_VERSION: "1"
      ORCA_EXPECTED_COMMIT: "8500fcdccaa10b5099ac20d252af3a7c560046f1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health && curl -fsS http://localhost:3000/capabilities | grep -q '8500fcdccaa10b5099ac20d252af3a7c560046f1'"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [slicer]

  bambu-studio-api:
    image: ${BAMBU_SIDECAR_IMAGE:?set BAMBU_SIDECAR_IMAGE to an immutable image@sha256 reference}
    container_name: bambu-studio-api
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./data/bambu:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    profiles: [bambu]
    networks: [slicer]

networks:
  slicer:
    internal: true
